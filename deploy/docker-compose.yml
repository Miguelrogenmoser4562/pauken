services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: pauken
      POSTGRES_PASSWORD: ${PG_PASSWORD:-pauken}
      POSTGRES_DB: pauken
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pauken"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    environment:
      HOST: "0.0.0.0"
      PORT: "4180"
      DATABASE_URL: postgres://pauken:${PG_PASSWORD:-pauken}@postgres:5432/pauken
      USERS_PATH: /etc/pauken/users.json
      WHISPER_API_URL: http://whisper:9000
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
    ports:
      - "127.0.0.1:4180:4180"
    volumes:
      - ../server/users.json:/etc/pauken/users.json
    depends_on:
      postgres:
        condition: service_healthy

  whisper:
    image: ghcr.io/ggerganov/whisper.cpp:main
    restart: unless-stopped
    command:
      - "--model"
      - "ggml-medium.bin"
      - "--port"
      - "9000"
      - "--host"
      - "0.0.0.0"
      - "--threads"
      - "40"
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - whisper-models:/root/.cache/whisper.cpp

volumes:
  pgdata:
  whisper-models:
